stages:
  - build
  - docs

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  paths:
    - .m2/repository

default:
  image: maven:3.9.9-eclipse-temurin-25

build-linux:
  stage: build
  tags:
    - linux
  script:
    - mvn clean javafx:jlink
    - mv target/gamebox target/gamebox-linux
  artifacts:
    paths:
      - target/gamebox-linux
    expire_in: 30 days

build-windows:
  stage: build
  tags:
    - windows
  script:
    - mvn clean javafx:jlink
    - Rename-Item target\gamebox gamebox-windows
    - Move-Item gamebox-windows target\
  artifacts:
    paths:
      - target/gamebox-windows
    expire_in: 30 days

docs:
  stage: docs
  tags:
    - linux
  before_script:
    - apt-get update && apt-get install -y texlive-full
  needs:
    - job: build-linux
      artifacts: true
  script:
    - mvn -Pdocs generate-resources
  artifacts:
    when: always
    paths:
      - target/docs/*.pdf
      - target/docs/latex/*.log
    expire_in: 30 days
